name: Temporary Campaign XI reference cleanup

on:
  push:
    branches:
      - timeline-a-xi-reconstruction
    paths:
      - .github/scripts/campaign_xi_reference_cleanup.py

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Campaign XI cleanup
        run: python .github/scripts/campaign_xi_reference_cleanup.py
      - name: Commit published reference changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaign-xi.html canon-ledger.html relics.html factions.html atlas.html chronology.html search-index.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Propagate Campaign XI reconstruction into reference pages"
            git push origin HEAD:timeline-a-xi-reconstruction
          fi
