name: Temporary Timeline A reference cleanup

on:
  push:
    branches:
      - timeline-a-reference-cleanup
    paths:
      - .github/scripts/reference_cleanup.py

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted reference cleanup
        run: python .github/scripts/reference_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters.html search-index.js canon-ledger.html atlas.html factions.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Propagate early Timeline A canon into reference pages"
            git push origin HEAD:timeline-a-reference-cleanup
          fi
