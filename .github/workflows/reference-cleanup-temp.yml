name: Temporary final reference fix
on:
  push:
    branches: [timeline-a-reference-cleanup]
    paths: [.github/scripts/reference_cleanup_final.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/reference_cleanup_final.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix Campaign XII character browser label"
            git push origin HEAD:timeline-a-reference-cleanup
          fi
